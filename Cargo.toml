[package]
name = "tetron-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Interactive terminal UI for the tetron P2P mesh VPN"
license = "MPL-2.0"

[[bin]]
name = "tetron-tui"
path = "src/main.rs"

[dependencies]
# Pinned to the daemon's wire protocol (v0.14.0). Bump the rev in lockstep
# with the deployed daemon so the msgpack schema always matches.
tetron-proto = { git = "https://github.com/ErikAllanKincaid/tetron", rev = "135a365" }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
futures = "0.3"
anyhow = "1"
